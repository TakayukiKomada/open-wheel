# Registry integrity gate — see scripts/verify-wheel.mjs for what is checked.
# Node builtins only, no install step.
name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/verify-wheel.mjs
